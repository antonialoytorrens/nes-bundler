limit_req_zone $binary_remote_addr zone=bundler_post:10m rate=1r/s;

http {

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off; # let clients pick; TLS 1.3 ignores this anyway

    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m; # about 40000 sessions
    ssl_session_tickets off; # disabling tickets preserves forward secrecy

    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 1.0.0.1 [2606:4700:4700::1111] valid=60s;
    resolver_timeout 2s;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name bundler.example.com;

        return 308 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name bundler.example.com;

        ssl_certificate /etc/letsencrypt/live/bundler.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/bundler.example.com/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always; # HSTS, 2 years
        add_header X-Robots-Tag "noindex, nofollow" always; # discourage crawlers at the HTTP level

        client_max_body_size 50m; # rejects uploads over 50 MB before reaching the app

        location = /robots.txt {
            add_header Content-Type text/plain;
            return 200 "User-agent: *\nDisallow: /\n";
        }

        location = /bundle {
            limit_req        zone=bundler_post burst=3 nodelay;
            limit_req_status 429;

            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
        }

        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;

            proxy_buffering         off; # streams bundle.tar.gz directly to the client
            proxy_request_buffering on;
            proxy_read_timeout      300s;
        }
    }
}
